name: daily-readings

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # runner 默认 UTC，会写出 "2026-10-16 (UTC+00:00)"，而推广站点那侧的页面按北京时间写
    # "2026-10-17"。两个产物同指一个瞬间却标不同日历日，读者只会以为有一个错了。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: node --test

      - name: Probe live endpoints
        run: |
          mkdir -p results
          node src/cli.mjs --json > results/latest.json
          node src/to-markdown.mjs results/latest.json > /dev/null

      - name: Commit generated readings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain results/ RESULTS.md)" ]]; then
            git add results/ RESULTS.md
            git commit -m "data: daily transparency readings"
            git push
          else
            echo "readings unchanged"
          fi

      # 一家都读不到时，README 里那张表就成了无来源的数字——这时必须吵。
      # 全 AUTH 不算失败：那本身就是有效读数。
      - name: Fail loudly if every probe came back unreadable
        run: |
          node -e '
          const d = JSON.parse(require("fs").readFileSync("results/latest.json", "utf8"));
          const levels = d.results.map(r => r.level);
          const usable = levels.filter(l => l === "YES" || l === "NO" || l === "AUTH").length;
          console.log("levels:", levels.join(", "), "| usable:", usable + "/" + levels.length);
          if (usable === 0) { console.error("REFUSED: 没有任何一家给出可用读数，README 表格已失去来源"); process.exit(1); }
          '
