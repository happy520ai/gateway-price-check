name: publish-mcp-registry

# 只在版本 tag 上跑：包、server.json 里的 URL 与 sha、注册表里的版本号，
# 三者必须由同一次运行生成 —— 手抄 sha 的注册表条目，第一次重打包就会指向旧字节。
on:
  push:
    tags: ['v*']

permissions:
  contents: write      # 建 release 并上传 .mcpb
  id-token: write      # 注册表 OIDC 所有权校验（不需要我登录，也不需要 PAT）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 有一条既有测试要 git rev-parse 结果包头部记的来源 commit；
          # 默认 fetch-depth=1 时祖先根本不在树上（这坑在 ci.yml 里已经踩过一次）。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test before packaging (46+ arms incl. MCP stdio)
        env:
          GPC_LIVE_TESTS: '1'
        run: node --test

      - name: Build and self-verify the .mcpb bundle
        id: bundle
        run: |
          set -euo pipefail
          out=$(python3 scripts/build-mcpb.py)
          echo "$out"
          sha=$(printf '%s\n' "$out" | sed -n 's/^SHA256 //p')
          [ -n "$sha" ] || { echo "REFUSED: 没算出 sha256"; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Publish the bundle as a release asset
        id: asset
        env:
          # gh 在 workflow 里不读 GITHUB_TOKEN，只认 GH_TOKEN —— 上一次就是在这里退 4。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "See the repository README; this tag's asset is the installable MCP bundle (gateway-price-check-mcp.mcpb)." 2>/dev/null || true
          gh release upload "$TAG" dist/gateway-price-check-mcp.mcpb --clobber
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/gateway-price-check-mcp.mcpb"
          # 回读服务端：资产必须真的在 release 上，且 sha 与我们刚算的一致。
          remote=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)
          if [ "$remote" != "${{ steps.bundle.outputs.sha256 }}" ]; then
            echo "REFUSED: 下载回来的资产 sha=$remote ≠ 本地 ${{ steps.bundle.outputs.sha256 }}"; exit 1
          fi
          # 注册表要求 identifier 里含 "mcp"（文件名 .mcpb 满足）
          case "$url" in *mcp*) ;; *) echo "REFUSED: URL 里没有 mcp，注册表不会放行"; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Fill server.json from this run's artifact
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const [p] = doc.packages;
            if (!p || p.registryType !== "mcpb") throw new Error("REFUSED: server.json 里没有 mcpb 包项");
            p.identifier = process.env.GPC_URL;
            p.fileSha256 = process.env.GPC_SHA;
            const want = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (doc.version !== want) throw new Error("REFUSED: server.json version=" + doc.version + " 而 tag 是 " + want);
            const s = JSON.stringify(doc, null, 2) + "\n";
            if (doc.description.length > 100) throw new Error("REFUSED: description " + doc.description.length + " 字符，注册表上限 100");
            if (s.includes("__MCPB_")) throw new Error("REFUSED: 占位符没被替换，不发");
            fs.writeFileSync("server.json", s);
            console.log("server.json ->", p.identifier, p.fileSha256.slice(0, 12) + "…");
          '
        env:
          GPC_URL: ${{ steps.asset.outputs.url }}
          GPC_SHA: ${{ steps.bundle.outputs.sha256 }}

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          # 资产名是小写 os + amd64/arm64：mcp-publisher_linux_amd64.tar.gz。
          # 上一版写死 Linux_x86_64，拿回来的是 404 的 HTML，tar 报 "not in gzip format"。
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          url="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz"
          code=$(curl -sSL -o pub.tar.gz -w '%{http_code}' "$url")
          [ "$code" = 200 ] || { echo "REFUSED: 下载 mcp-publisher 得到 HTTP $code（$url）"; exit 1; }
          file pub.tar.gz | grep -q gzip || { echo "REFUSED: 下载回来的不是 gzip，不解压"; exit 1; }
          tar xzf pub.tar.gz mcp-publisher
          ./mcp-publisher --help >/dev/null || { echo "REFUSED: mcp-publisher 起不来"; exit 1; }

      - name: Authenticate to the MCP Registry via OIDC
        run: ./mcp-publisher login github-oidc

      - name: Validate then publish
        run: |
          set -euo pipefail
          ./mcp-publisher validate
          ./mcp-publisher publish

      # 发完必须从注册表自己读回来：受理不等于在册，在册不等于版本对，
      # 版本对不等于那条 sha 还指向真实服务端上的字节。
      # 上一版这条臂本身写错过两次：拿 tag 名 "v0.5.4" 去比注册表的 "0.5.4"，
      # 又用了不存在的 /api/v1/servers 路径（正解是 /v0/servers?search=）。
      - name: Read the server back out of the registry
        run: |
          set -euo pipefail
          body=$(curl -sS --retry 4 --retry-delay 10 \
            "https://registry.modelcontextprotocol.io/v0/servers?search=gateway-price")
          printf '%s' "$body" > reg.json
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("reg.json", "utf8"));
            const list = (j.servers || []).map(x => x.server);
            const s = list.find(x => x.name === "io.github.happy520ai/gateway-price-check");
            if (!s) throw new Error("REFUSED: 注册表搜索结果里没有这个条目");
            if (s.version !== process.env.GPC_WANT.replace(/^v/, ""))
              throw new Error("REFUSED: 注册表里的版本是 " + s.version + "，这次推的是 " + process.env.GPC_WANT);
            const p = (s.packages || [])[0];
            if (!p || p.registryType !== "mcpb") throw new Error("REFUSED: 条目里没有 mcpb 包项");
            if (!String(p.identifier).includes("mcp")) throw new Error("REFUSED: identifier 里没有 mcp");
            if (!/^[0-9a-f]{64}$/.test(p.fileSha256 || "")) throw new Error("REFUSED: fileSha256 形状不对");
            fs.writeFileSync("asset-url.txt", p.identifier);
            fs.writeFileSync("want-sha.txt", p.fileSha256);
            console.log("在册 version=" + s.version + " transport=" + p.transport.type);
          '
          # 最后一道：注册表声称的 sha，必须等于此刻从公开 URL 真能下下来的那串字节。
          url=$(cat asset-url.txt)
          served=$(curl -sSL "$url" | sha256sum | cut -d' ' -f1)
          echo "served=$served"
          [ "$served" = "$(cat want-sha.txt)" ] || { echo "REFUSED: 注册表里的 sha 与服务端字节不一致（条目指向旧包）"; exit 1; }
          echo "REGISTRY VERIFIED: 在册、版本对、sha 对得上真实字节"
        env:
          GPC_WANT: ${{ github.ref_name }}
