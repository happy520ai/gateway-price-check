name: daily-readings

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # runner 默认 UTC，会写出 "2026-10-16 (UTC+00:00)"，而推广站点那侧的页面按北京时间写
    # "2026-10-17"。两个产物同指一个瞬间却标不同日历日，读者只会以为有一个错了。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          # 同上：本 job 也跑 node --test，其中一条断言要解析祖先 commit。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe live endpoints
        run: |
          mkdir -p results
          # CLI 对"有不可判项"返回非 0（这是它该有的信号）。但在这里如果让它直接中断本步，
          # 后面生成 svg / 重写 README / 提交 全被跳过——2026-10-17 真机就这样：
          # 一家网关从 GitHub 机房连不通（3 次重试全失败），于是整条每日链停更一天，
          # 而我新加的判定脚本根本没机会运行。判定权交给 assert-decidable，这里只如实记下退码。
          set +e
          node src/cli.mjs --json > results/latest.json
          probe_rc=$?
          set -e
          echo "cli exit=$probe_rc（1=有不可判项 · 2=有未解析的价格键）"
          if [ ! -s results/latest.json ]; then echo "REFUSED: latest.json 是空的"; exit 1; fi
          # 图先于页：RESULTS.md 里那个 ![](results/latest.svg) 必须指向本次刚生成的图，
          # 否则页面引用的是上一天的图，图文打架正好是这套东西要防的事。
          node src/to-svg.mjs results/latest.json
          node src/to-markdown.mjs results/latest.json > /dev/null

      # 测试必须排在生成之后。原先它排在探测之前，于是发生这件事：
      # CI 先把 README 里"OpenRouter 是 466/466"这类断言对着**旧**读数验一遍（通过），
      # 再写入**新**读数，然后提交——把一条已经和 README 正文矛盾的快照推上线，
      # 而这条矛盾要等下一次运行才变红。生成后再测，才能当天就拦住。
      - name: Unit tests (against the freshly generated artifacts)
        run: node --test

      - name: Commit generated readings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain results/ RESULTS.md README.md)" ]]; then
            git add results/ RESULTS.md README.md
            git commit -m "data: daily transparency readings"
            git push
          else
            echo "readings unchanged"
          fi

      # 一家都读不到时，README 里那张表就成了无来源的数字——这时必须吵。
      # 全 AUTH 不算失败：那本身就是有效读数。
      # 与 ci.yml 共用同一个判定脚本，规则只有一份定义。
      # 原先这里只问 usable===0（只要还剩一家能读就算好），比 CI 那条松得多——
      # 同一件事在两个 job 里标准不同，松的那个就会成为实际生效的那个。
      - name: Assert the daily readings are still a usable comparison
        run: node scripts/assert-decidable.mjs results/latest.json
