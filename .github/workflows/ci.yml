name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # 有一条测试要 git rev-parse bundle 头部记录的来源 commit。
          # checkout 默认 fetch-depth=1，祖先 commit 根本不在树上，
          # 于是该断言在 CI 里必然以 unknown revision 失败（已在 depth=1 克隆里复现）。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests (incl. the two must-fail arms)
        run: node --test
      # MCP 服务端要真握手才算存在：这条在两个 OS 上各起一次子进程，
      # 打开 GPC_LIVE_TESTS 后连"经 MCP 得到的判词"也一起吃真端点。
      - name: MCP stdio handshake (live arms enabled)
        env:
          GPC_LIVE_TESTS: '1'
        run: node --test test/mcp.test.mjs
      # 在 Linux 与 Windows 上各跑一次真端点：
      # 之前那个 libuv 退出断言只在 Windows 复现，单平台 CI 抓不到。
      # 这一步原先是 `node src/cli.mjs` 直接看退出码，要求 11 家全部可判。
      # 那测的不是本工具，是 GitHub runner 的出网：Volcengine Ark 从 ubuntu 能通、
      # 从 windows 三次重试全失败（2026-10-17 实测，两个臂各红过一次）。
      # 一个随 runner 网络状态翻脸的闸，最终教会所有人的是"忽略它"。
      # 现在断言这件测试真正该保证的事：被测主体必须读得到，且多数家读得到。
      - name: Live probe must stay decidable
        run: |
          # 不让 CLI 的退码直接中断本步，否则判定脚本没机会跑（详见 daily.yml 同处注释）。
          set +e
          node src/cli.mjs --json > probe.json
          echo "cli exit=$?"
          set -e
          node scripts/assert-decidable.mjs probe.json
